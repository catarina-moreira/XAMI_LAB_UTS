title: "OrdinoR: A Framework for Discovering, Evaluating, and Analyzing Organizational Models Using Event Logs"
authors: "Jing Yang, Chun Ouyang, Wil M.P. van der Aalst, Arthur H.M. ter Hofstede, Yang Yu"
venue: "Decision Support Systems, 158, 113771, 2022"
year: 2022
type: journal
doi: "https://doi.org/10.1016/j.dss.2022.113771"
abstract: "In order to streamline business processes and increase competitiveness, organizations need to have a deep insight into the resources that they deploy. Among others, they need to understand how these resources act in groups to achieve organizational outcomes. Accurate and timely information is a sine qua non to achieve this understanding. Process mining can be exploited for the purpose of deriving organizational models from event logs that contain resource-related data. But existing process mining techniques are not fully up to this task, as they are not able to cope with the multi-faceted nature of business processes and are not yet able to determine how resource groupings are involved in process execution. In addition, there is no provision for how to evaluate the quality of discovered organizational models. To tackle these challenges, we propose a novel framework, OrdinoR, capable of supporting discovery of organizational models using event logs, their evaluation, and their analysis. OrdinoR is constructed around a rich notion of organizational model where resource groupings are linked to multiple dimensions of process execution. The framework also provides a set of measures for systematically evaluating such models and analyzing the behavior of resource groups therein. Experiments have been conducted to evaluate the framework using a publicly available real-life dataset. These demonstrate the usefulness of the approach."
