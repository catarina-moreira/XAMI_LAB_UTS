title: "Comparing Visual Search Patterns in Chest X-Ray Diagnostics"
authors: "Catarina Moreira, Diogo Miguel Alvito, Sandra Costa Sousa, Isabel Maria Gomes Blanco Nobre, Chun Ouyang, Regis Kopper, Andrew Duchowski, Joaquim Jorge"
venue: "In Proceedings of 2023 Symposium on Eye Tracking Research and Applications (ETRA), 4, 2023"
year: 2023
type: conference
doi: "https://doi.org/10.1145/3588015.3588403"
abstract: "Radiologists are trained professionals who use medical images to obtain clinically relevant information. However, little is known about visual search patterns and strategies radiologists employ during medical image analysis. Thus, there is a current need for guidelines to specify optimal visual search routines commonly used by radiologists. Identifying these features could improve radiologist training and assist radiologists in their work. Our study found that during the moments in which radiologists view chest X-ray images in silence before verbalizing the analysis, they exhibit unique search patterns regardless of the type of disease depicted. Our findings suggest that radiologists' search behaviors can be identified at this stage. However, when radiologists verbally interpret the X-rays, the gaze patterns appear noisy and arbitrary. Current deep-learning approaches train their systems using this noisy and arbitrary gaze data. This may explain why previous research still needs to show the superiority of deep-learning models that use eye tracking for disease classification. Our paper investigates these patterns and attempts to uncover the eye-gaze configurations during the different analysis phases."
